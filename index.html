<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Login</title>
<style>
* {margin: 0; padding: 0; box-sizing: border-box;}
body {
  font-family: 'Segoe UI', Arial, sans-serif; 
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  height: 100vh; 
  margin: 0;
}
.login-box {
  background: white; 
  padding: 40px; 
  border-radius: 15px; 
  box-shadow: 0 15px 35px rgba(0,0,0,0.2); 
  width: 350px;
}
.login-box h2 {
  text-align: center; 
  margin-bottom: 30px; 
  color: #333;
  font-size: 28px;
}
.login-box input {
  width: 100%; 
  padding: 14px; 
  margin: 12px 0; 
  border: 2px solid #e0e0e0; 
  border-radius: 8px; 
  font-size: 15px;
  outline: none;
}
.login-box input:focus {
  border-color: #667eea;
}
.login-box button {
  width: 100%; 
  padding: 14px; 
  background: linear-gradient(135deg, #667eea, #764ba2); 
  color: white; 
  border: none; 
  border-radius: 8px; 
  font-size: 16px; 
  font-weight: bold;
  cursor: pointer; 
  margin-top: 15px;
}
.login-box button:hover {
  transform: translateY(-2px);
}
</style>
</head>
<body>
<div class="login-box">
<h2>Welcome Back</h2>
<input type="text" placeholder="Enter Username" id="user">
<input type="password" placeholder="Enter Password" id="pass">
<button onclick="alert('Login Successful!')">Login</button>
</div>
</body>
  </html>
